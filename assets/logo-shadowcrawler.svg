<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo -->
  <rect width="256" height="256" fill="#050816"/>

  <!-- Círculo central (núcleo del crawler) -->
  <circle cx="128" cy="128" r="40" fill="#7C3AED"/>

  <!-- Líneas radiales (patas / conexiones) -->
  <line x1="128" y1="48"  x2="128" y2="88"  stroke="#A855F7" stroke-width="4" stroke-linecap="round"/>
  <line x1="128" y1="208" x2="128" y2="168" stroke="#A855F7" stroke-width="4" stroke-linecap="round"/>
  <line x1="48"  y1="128" x2="88"  y2="128" stroke="#A855F7" stroke-width="4" stroke-linecap="round"/>
  <line x1="208" y1="128" x2="168" y2="128" stroke="#A855F7" stroke-width="4" stroke-linecap="round"/>

  <!-- Diagonales (sensación de red) -->
  <line x1="80"  y1="80"  x2="104" y2="104" stroke="#22D3EE" stroke-width="3" stroke-linecap="round"/>
  <line x1="176" y1="80"  x2="152" y2="104" stroke="#22D3EE" stroke-width="3" stroke-linecap="round"/>
  <line x1="80"  y1="176" x2="104" y2="152" stroke="#22D3EE" stroke-width="3" stroke-linecap="round"/>
  <line x1="176" y1="176" x2="152" y2="152" stroke="#22D3EE" stroke-width="3" stroke-linecap="round"/>

  <!-- Anillo exterior suave -->
  <circle cx="128" cy="128" r="80" fill="none" stroke="#1E293B" stroke-width="2"/>

  <!-- Texto opcional (puedes quitarlo si prefieres solo símbolo) -->
  <text x="128" y="230" text-anchor="middle" fill="#E5E7EB"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="18">
    ShadowCrawler
  </text>
</svg>
