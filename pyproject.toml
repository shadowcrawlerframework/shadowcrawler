[project]
name = "shadowcrawler"
version = "4.1.0"
description = "ShadowCrawler — High-performance modular crawling framework"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }

authors = [
    { name = "Allan Mancera" }
]

keywords = [
    "crawler",
    "scraping",
    "playwright",
    "framework",
    "automation",
    "spider"
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
	"Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
	"Programming Language :: Python :: 3.14",
    "License :: Free To Use But Restricted",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries",
]

dependencies = [
    "requests",
    "beautifulsoup4",
    "playwright",
]

[project.urls]
Homepage = "https://shadowcrawlerframework.itch.io/shadowcrawler"
Documentation = "https://shadowcrawlerframework.itch.io/shadowcrawler"
Source = "https://shadowcrawlerframework.itch.io/shadowcrawler"
Issues = "https://shadowcrawlerframework.itch.io/shadowcrawler"

[project.scripts]
shadowcrawler = "shadowcrawler.cli.main:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
